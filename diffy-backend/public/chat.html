<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #diffy-frame { width: 100%; height: 100vh; border: none; display: none; }
    #diffy-error {
      display: none;
      height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #666;
      padding: 24px;
    }
    #diffy-error h2 { color: #333; margin-bottom: 8px; font-size: 18px; }
    #diffy-error p { font-size: 14px; }
  </style>
</head>
<body>
  <iframe id="diffy-frame" allow="microphone"></iframe>
  <div id="diffy-error">
    <div>
      <h2>Chat not available</h2>
      <p>No agent is configured for this page.</p>
    </div>
  </div>

  <script>
    (() => {
      // Address of the Diffy backend, e.g. "https://your-domain/diffy-backend".
      // Leave empty when this file is served by the backend itself: it then
      // uses the folder it was loaded from. Set it when you host a copy of
      // this file on your own website.
      const BACKEND_URL = "https://tutor.learncs.eu/diffy-backend";

      // This page asks the backend which Diffy agent belongs to the page it
      // is shown on (matched against the hostname / URL you saved for the
      // agent), then points the iframe at that agent's chat link. From then
      // on the browser talks to Diffy directly, and no messages pass through
      // the backend.
      const base =
        BACKEND_URL ||
        window.location.origin + window.location.pathname.replace(/\/[^/]*$/, "");

      // The page the agent is chosen for, in order:
      //   1. ?site=example.com (or a full URL) on this page's address, so one
      //      shared copy of this file can be pointed at a site explicitly;
      //   2. when embedded in another site's iframe, that site, from
      //      document.referrer (browsers usually send only its origin, e.g.
      //      https://example.com/, so save the agent as that origin);
      //   3. otherwise this page's own address.
      const resolvePageUrl = () => {
        const site = new URLSearchParams(window.location.search).get("site");
        if (site) return /^https?:\/\//i.test(site) ? site : `https://${site}`;

        let framed;
        try {
          framed = window.self !== window.top;
        } catch {
          framed = true; // cross-origin parent
        }
        if (framed && document.referrer) return document.referrer;

        return window.location.href;
      };

      const init = async () => {
        try {
          const res = await fetch(`${base}/diffy-iframe/check`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ page_url: resolvePageUrl() }),
          });

          if (!res.ok) throw new Error(`check failed: ${res.status}`);
          const data = await res.json();

          const frame = document.getElementById("diffy-frame");
          frame.src = data.iframe_url;
          frame.style.display = "block";
        } catch (err) {
          console.error("[chat] Failed to resolve agent:", err);
          document.getElementById("diffy-error").style.display = "flex";
        }
      };

      init();
    })();
  </script>
</body>
</html>
